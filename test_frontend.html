<!DOCTYPE html>
<html>
<head>
    <title>Frontend Test</title>
</head>
<body>
    <h1>Frontend Test Page</h1>
    <p>If you can see this page, the frontend server is working.</p>
    <p>Try accessing: <a href="http://localhost:8080" target="_blank">http://localhost:8080</a></p>
    
    <h2>Backend Test</h2>
    <button onclick="testBackend()">Test Backend Connection</button>
    <div id="result"></div>
    
    <script>
        async function testBackend() {
            try {
                const response = await fetch('http://localhost:5000/health');
                const data = await response.json();
                document.getElementById('result').innerHTML = 
                    `<p style="color: green;">✅ Backend working: ${JSON.stringify(data)}</p>`;
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<p style="color: red;">❌ Backend error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
