<!DOCTYPE html>
<html>
<head>
    <title>Input Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        textarea {
            height: 80px;
            resize: vertical;
        }
    </style>
</head>
<body>
    <h1>Input Test Page</h1>
    <p>If you can type here, then the issue is with the React component.</p>
    
    <form>
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Type your name here">
        </div>
        
        <div class="form-group">
            <label for="bio">Bio:</label>
            <textarea id="bio" placeholder="Type your bio here"></textarea>
        </div>
        
        <div class="form-group">
            <label for="availability">Availability:</label>
            <input type="text" id="availability" placeholder="Type your availability here">
        </div>
    </form>
    
    <script>
        // Test if inputs work
        document.getElementById('name').addEventListener('input', function(e) {
            console.log('Name changed:', e.target.value);
        });
        
        document.getElementById('bio').addEventListener('input', function(e) {
            console.log('Bio changed:', e.target.value);
        });
        
        document.getElementById('availability').addEventListener('input', function(e) {
            console.log('Availability changed:', e.target.value);
        });
    </script>
</body>
</html>
